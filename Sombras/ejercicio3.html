<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <style>

        body {
            font-family: Georgia, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;

        }

        /* titulo con sombra  */
        .title {
            font-size: 40px;
            text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.5);
            margin-bottom: 35px;
        }

        /* Tarjeta principal */
        .card {
            width: 340px;
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 12px;
            padding: 40px ;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 8px 10px 15px rgba(0, 0, 0, 0.6);
        }

        /* Imagen circulo */
        .imagen {
            width: 220px;
            height: 220px;   
            margin-bottom: 25px;
        }

        /* Nombre */
        .name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 28px;
        }

        /* Botón morado */
        .boton {
            background: linear-gradient(65deg, #351064 50%, #8b55b5 );
            color: #ffffff;
            border-radius: 6px;
            padding: 18px 35px;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div class="title">CSS CARD</div>

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135768.png" class="imagen">
        <div class="name">Mario [CEO Google]</div>

        <button class="boton">Entra ahora</button>
    </div>

</body>

</html>
