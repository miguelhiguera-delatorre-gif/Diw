<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Horario de Clase</title>
      <link rel="stylesheet" href="estilos.css">

</head>
<body>

  <h2><u><a href="#">HORARIO DE CLASE CURSO 2020-2021</a></u></h2>

  <table border="1">
    <thead>
      <tr>
        <th>HORAS</th>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>8:00</td>
        <td rowspan="2">Matemáticas</td>
        <td>Lengua</td>
        <td>Inglés</td>
        <td colspan="2">Ciencias</td>
      </tr>
      <tr>
        <td>9:00</td>
        <td>Historia</td>
        <td>Ciencias</td>
        <td>Matemáticas</td>
        <td>Lengua</td>
      </tr>
      <tr>
        <td>10:00</td>
        <td colspan="5">RECREO</td>
      </tr>
      <tr>
        <td>10:30</td>
        <td>Inglés</td>
        <td rowspan="2">Ciencias</td>
        <td>Matemáticas</td>
        <td>Lengua</td>
        <td>Historia</td>
      </tr>
      <tr>
        <td>11:30</td>
        <td>Historia</td>
        <td>Ciencias</td>
        <td>Matemáticas</td>
        <td>Inglés</td>
      </tr>
    </tbody>
  </table>

  <form class="form-container">
    <div class="form-group">
      <label for="email">Email </label>
      <input type="email" id="email" name="email" placeholder="Inserte email del destinatario">
    </div>
    <button type="submit">Enviar Horario</button>
  </form>

</body>
</html>
