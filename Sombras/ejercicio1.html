<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>CSS Shadows</title>
    <style>

        /* box-shadow: X Y difuminado color; */
        /* X controla el desplazamiento horizontal:
            - Positivo (10px): derecha.
            - Negativo (-10px): izquierda.



           Y controla el desplazamiento vertical:
            - Positivo (10px): abajo.
            - Negativo (-10px): arriba. */

        
        .shady1{
            box-shadow: 10px 10px 15px greenyellow;
            width: 220px;
            padding: 10px;
            background-color: aliceblue;

        }

        .shady2{
            box-shadow: -10px -10px 1px -5px red;
            /* el -5px sirve para que sea mas fino */
            width: 220px;
            padding: 10px;
            margin-top: 25px;
            background-color: aliceblue;

        }

        .shady3{
            box-shadow: 10px 0px 1px -5px blue;
            width: 220px;
            padding: 10px;
            margin-top: 25px;
            background-color: aliceblue;

        }

        .title {
            display: inline-block;
             background-image: linear-gradient(to right, #d32700, #f8a2c9, #24c6dc);
             background-clip: text;
             color: transparent;
        }

        h3{
            text-shadow: 2px 2px 3px rgba(9, 100, 100, 0.5);
        }
    </style>
</head>

<body>
    <header>
        <h1 class="title">CSS: Shadows</h1>
    </header>

    <main>
            <article>
                    <h3 class="title">Shadows</h3>
                    <p>
                        This is a <a href="http://www.google.es" title="Go to google">link to Google</a>
                        This is just a random text that we put to show the use the shadow
                    </p>
                    <div class="shady1">
                        This is div block with shadow
                    </div>
                    <div class="shady2">
                        This is div block with shadow2
                    </div>
                    <div class="shady3">
                        This is div block with shadow3
                    </div>
            </article>
    </main>

</body>

</html>
