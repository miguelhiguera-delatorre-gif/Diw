<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Ejercicio4</title>
    <style>
        /* Ejercicio 4.a*/
        body {
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 123, 255, 0.4), rgba(0, 123, 255, 0));
        }

        /* Sombra para el título */
        .title {
            text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.4);
        }

        /* Div 1 */
        .shady1 {
            box-shadow: 10px 10px 15px greenyellow;
            width: 220px;
            padding: 10px;
            margin-bottom: 25px;
        }

        /* div 2 */
        .shady2 {
            width: 500px;
            height: 70px;
            margin-bottom: 25px;
            background: linear-gradient(to right, red, orange, yellow, green, blue, purple, pink);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4b5563;
            font-weight: bold;
            font-size: 20px;
        }

        /* div 3*/
        .shady3 {
            width: 150px;
            height: 150px;
            padding: 0;
            border-radius: 50%;
            background: conic-gradient(red, orange, yellow, green, blue, indigo, black, red);
        }
    </style>
</head>

<body>
    <header>
        <h1 class="title">CSS: Shadows</h1>
    </header>
    <main>
        <article>
            <h3 class="title">Shadows</h3>
            <p>
                This is a <a href="http://www.google.es" title="Go to google">link to Google</a>
                This is just a random text that we put to show the use the shadow
            </p>

            <div class="shady1">
                This is div block with shadow
            </div>
            <div class="shady2">
                Rainbow Background
            </div>
            <div class="shady3"></div>
        </article>
    </main>
</body>

</html>
