<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CSS Shadows & Buttons</title>
    <style>
     
       
        
        /* Botón 1 (Rojo) */
        .rojo   {
            display: inline-block;
            background: linear-gradient(to bottom, red, darkred);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 2px #000;
        }

        /* Botón 2 (Naranja en contenedor) */
        .container {
            background: #dbeef4;
            width: 200px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }


        .naranja {
            background: linear-gradient(to bottom, #ffb334, #ff8c00);
            color: #fff;
            padding: 10px 30px;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .naranja:hover {
            background: linear-gradient(to bottom, #ffc45d, #ffa024); /* Colores más claros */
            box-shadow: 0 0 12px rgba(255, 165, 0, 0.8); /* Resplandor naranja */
        }
    </style>
</head>
<body>
   
    <a href="#" class="rojo">Botón de ejemplo</a>

    <div class="container">
        <a href="#" class="naranja">Entra</a>
    </div>
</body>
</html>
