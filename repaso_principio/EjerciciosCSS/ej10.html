
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 10 - Modelo de caja</title>

    <style>
        /* Primer div */
        .caja-primera {
            width: 200px;
            padding: 10px;
            border: 2px solid red;
            margin: 10px;
            background-color: lightcoral;
        }

        /* Segundo div */
        .caja-segunda {
            width: 300px;
            padding: 10px;
            border: 2px solid blue;
            margin: 10px;
            background-color: lightblue;
        }

        /* Tercer div */
        .caja-tercera {
            width: 300px;
            padding: 10px;
            border: 2px solid green;
            margin: 10px;
            background-color: lightgreen;
        }

        /* Spans */
        span {
            display: inline-block;
            width: 180px;
            padding: 5px;
            border: 1px solid black;
            margin: 5px;
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1>Modelo de caja</h1>

    <div class="caja-primera">
        Primer div de 200px
    </div>

    <div class="caja-segunda">
        Segundo div de 300px
    </div>

    <div class="caja-tercera">
        Tercer div de 300px
    </div>

    <h2>Elementos span</h2>

    <span>Primer span</span>
    <span>Segundo span</span>
    <span>Tercer span</span>

</body>
</html>
