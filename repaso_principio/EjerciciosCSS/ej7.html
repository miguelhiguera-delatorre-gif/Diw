
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 7 - Pseudoelementos</title>

    <style>
        /* Estilos del párrafo */
        p {
            color: #333333;
            font-family: Arial, sans-serif;
        }

        /* Primera letra */
        p::first-letter {
            font-size: 3em;
            color: #111111;
        }

        /* Primera línea */
        p::first-line {
            font-size: 2em;
            color: #222222;
        }
    </style>
</head>

<body>

    <p>
        Este es un párrafo de ejemplo para practicar los pseudoelementos
        de CSS. La primera letra tendrá un tamaño de 3em y la primera
        línea tendrá un tamaño de 2em. El resto del párrafo será más pequeño.
    </p>

</body>
</html>
