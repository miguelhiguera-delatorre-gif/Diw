<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">  

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio Emmet 2</title>

</head>

<body>

    <!-- 1. Lista de 4 enlaces dentro de nav, div cabecera, ul navbar y li navitems -->

    <!-- nav>div.cabecera>ul.navbar>li.navitems*4>a -->

    <nav>

        <div class="cabecera">

            <ul class="navbar">

                <li class="navitems"><a href="">Enlace 1</a></li>

                <li class="navitems"><a href="">Enlace 2</a></li>

                <li class="navitems"><a href="">Enlace 3</a></li>

                <li class="navitems"><a href="">Enlace 4</a></li>

            </ul>

        </div>

    </nav>


    <!-- 2. Tres div card con imagen y titular h3 -->

    <!-- main>div.card*3>img.imgcard+h3 -->

    <main>

        <div class="card">

            <img class="imgcard" src="" alt="Imagen 1">

            <h3>Titular 1</h3>

        </div>

        <div class="card">

            <img class="imgcard" src="" alt="Imagen 2">

            <h3>Titular 2</h3>

        </div>

        <div class="card">

            <img class="imgcard" src="" alt="Imagen 3">

            <h3>Titular 3</h3>

        </div>

    </main>


    <!-- 3. Lista de definición para 5 elementos en de seccion1 -->

    <!-- section>div.seccion1>dl>(dt+dd)*5 -->

    <section>

        <div class="seccion1">

            <dl>

                <dt>Elemento 1</dt>
                <dd>Definición 1</dd>

                <dt>Elemento 2</dt>
                <dd>Definición 2</dd>

                <dt>Elemento 3</dt>
                <dd>Definición 3</dd>

                <dt>Elemento 4</dt>
                <dd>Definición 4</dd>

                <dt>Elemento 5</dt>
                <dd>Definición 5</dd>

            </dl>

        </div>

    </section>


    <!-- 4. Sección seccion2 con 6 imágenes gallery -->

    <!-- section.seccion2>img.gallery*6 -->

    <section class="seccion2">

        <img class="gallery" src="" alt="Imagen 1">

        <img class="gallery" src="" alt="Imagen 2">

        <img class="gallery" src="" alt="Imagen 3">

        <img class="gallery" src="" alt="Imagen 4">

        <img class="gallery" src="" alt="Imagen 5">

        <img class="gallery" src="" alt="Imagen 6">

    </section>


    <!-- 5. Footer con div pie, sección social con 3 imágenes y address con 3 párrafos -->

    <!-- footer>div.pie+section.social>img*3+address>p*3 -->

    <footer>

        <div class="pie"></div>

        <section class="social">

            <img src="" alt="Red social 1">

            <img src="" alt="Red social 2">

            <img src="" alt="Red social 3">

        </section>

        <address>

            <p>Dirección</p>

            <p>Teléfono</p>

            <p>Email</p>

        </address>

    </footer>


</body>

</html>
