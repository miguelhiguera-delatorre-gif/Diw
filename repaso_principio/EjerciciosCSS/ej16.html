<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Ejercicio posicionado</title>

    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family: sans-serif;
            width: 100%;
        }

        h1{
            position: relative;
            left: 20px;
        }

        /*Header y footer en linea  */
        nav div, footer div{
            display: inline; 
        }
        /* Enlaces header y footer */
        nav a, footer a{
            text-decoration: none;
            color: white;
            padding: 20px;

        }

        /*Header  */
        .sticky-menu{
            text-decoration: none;
            background-color: #254848;
            position: sticky;   
            padding: 20px;
            width: 100%;
        }

        /* Empezamos ccon el banner */
        .banner{
            background-color: lightblue;
            position: relative;
            width: 60%;
            margin-left: 20%;
            margin-right: 20%;
            height: 180px;
            top: 20px;
        }

        .logo1{
            background-color: darkolivegreen;
            position: absolute;
            height: 100px;
            width: 100px;
            z-index: 1;
            top: 50px;
            left: 50px;
        }

        .logo2{
            background-color: orange;
            position: absolute;
            height: 100px;
            width: 100px;
             top: 30px;
            left: 80px;

        }








        /* Footer */
        .footer{
            background-color: #254848;
            padding: 20px;
            width: 100%;
        }


    </style>


  </head>

  <body>
    
    <!-- Título del sitio con desplazamiento relativo -->

    <h1>Título del sitio</h1>

    <!-- Menú tipo sticky fijo al llegar al borde superior de la pantalla -->

    <nav class="sticky-menu">
      <div class="menu-element"><a href="#">Inicio</a></div>
      <div class="menu-element"><a href="#">Blog</a></div>
      <div class="menu-element"><a href="#">Contacto</a></div>
      <div class="menu-element"><a href="#">Acerca de</a></div>
    </nav>

    <section class="banner">
      <h4>BANNER</h4>
      <div class="logo logo1">LOGO</div>
      <div class="logo logo2">BACKLOGO</div>
    </section>

    <main class="content">
      <div class="centered">CONTENIDO CENTRADO HORIZONTAL Y VERTICAL</div>
    </main>

    <!-- footer fijo en pantalla -->
    <footer class="footer">
      <div class="menu-element"><a href="#">Inicio</a></div>
      <div class="menu-element"><a href="#">Blog</a></div>
      <div class="menu-element"><a href="#">Contacto</a></div>
      <div class="menu-element"><a href="#">Acerca de</a></div>
    </footer>

  </body>
</html>
